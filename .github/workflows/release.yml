name: Release

on:
  push:
    paths:
      - 'custom_components/virtual_devices/manifest.json'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from manifest
        id: extract_version
        if: github.event_name != 'release'
        run: |
          version=$(jq -r '.version' custom_components/virtual_devices/manifest.json)
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "version_number=${version#v}" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        if: github.event_name != 'release'
        run: |
          version="${{ steps.extract_version.outputs.version }}"
          if git rev-parse "$version" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $version already exists, skipping release"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $version does not exist, will create release"
          fi

      - name: Debug LLM API connection
        if: github.event_name == 'workflow_dispatch'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          echo "LLM_API_URL length: ${#LLM_API_URL}"
          echo "LLM_API_KEY length: ${#LLM_API_KEY}"
          echo "LLM_MODEL length: ${#LLM_MODEL}"
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "$LLM_API_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $LLM_API_KEY" \
            -d "{\"model\": \"$LLM_MODEL\", \"messages\": [{\"role\": \"user\", \"content\": \"say hi\"}], \"temperature\": 0.1}")
          echo "$response"

      - name: Generate changelog
        id: changelog
        if: github.event_name != 'release' && steps.check_tag.outputs.exists == 'false'
        uses: Desmond-Dong/actions/bilingual-changelog@v1
        with:
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          llm-api-url: ${{ secrets.LLM_API_URL }}
          llm-model: ${{ secrets.LLM_MODEL }}

      - name: Create tag and release
        if: github.event_name != 'release' && steps.check_tag.outputs.exists == 'false'
        run: |
          version="${{ steps.extract_version.outputs.version }}"
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "$version" -m "Release $version"
          git push origin "$version"

      - name: Create GitHub Release
        if: github.event_name != 'release' && steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.extract_version.outputs.version }}
          name: Release ${{ steps.extract_version.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false

      - name: Create zip file
        run: |
          cd ${{ github.workspace }}/custom_components/virtual_devices
          zip -r virtual_devices.zip ./

      - name: Upload release asset
        if: github.event_name != 'release' && steps.check_tag.outputs.exists == 'false'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ github.workspace }}/custom_components/virtual_devices/virtual_devices.zip
          asset_name: virtual_devices.zip
          tag: ${{ steps.extract_version.outputs.version }}
          overwrite: true

      - name: Upload release asset to existing release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ github.workspace }}/custom_components/virtual_devices/virtual_devices.zip
          asset_name: virtual_devices.zip
          tag: ${{ github.ref }}
          overwrite: true
